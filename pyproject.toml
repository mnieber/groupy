[project]
name = "breaker"
description = "Python refactoring tool"
version = "1.0.0"
readme = "README.md"
dependencies = []

[project.scripts]
breaker = "breaker.runtime.entrypoints.breaker:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
